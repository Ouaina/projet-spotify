<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoti'stat</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="./script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="bg-light" x-data="spotifyApp">

  <header class="bg-primary text-white text-center py-5 mb-4">
    <h1 class="fw-bold text-uppercase">Ma playlist</h1>
    <p class="fst-italic opacity-75">je sais pas quoi mettre comme sous-titre</p>
  </header>

  <main class="container">
    
    <section class="row g-4 mb-5">
      <div class="col-12 col-md-6">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-header bg-primary text-white fw-bold">Top 10 des Artistes</div>
          <div class="card-body" style="position: relative; height:320px;">
            <canvas id="artistsChart"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="card h-100 shadow-sm border-0">
          <div class="card-header bg-success text-white fw-bold">Distribution des Genres</div>
          <div class="card-body" style="position: relative; height:320px;">
            <canvas id="genresChart"></canvas>
          </div>
        </div>
      </div>
    </section>

    <section class="card shadow-sm border-0 mb-5">
      <div class="card-header bg-info text-white d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="fw-bold">Liste des Morceaux</span>
        <div class="col-12 col-sm-4">
          <input type="search" class="form-control form-control-sm" placeholder="Rechercher..." x-model="searchQuery">
        </div>
      </div>
      <div class="card-body p-0">
        
        <div class="table-responsive d-none d-md-block">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Titre</th>
                <th scope="col">Artiste</th>
                <th scope="col">Album</th>
                <th scope="col" class="text-end pe-4">Action</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="track in filteredTracks" :key="track.id">
                <tr>
                  <td class="fw-bold text-truncate" style="max-width: 250px;" x-text="track.name"></td>
                  <td x-text="track.artists[0]?.name"></td>
                  <td class="text-muted text-truncate" style="max-width: 200px;" x-text="track.album.name"></td>
                  <td class="text-end pe-4">
                    <button class="btn btn-primary btn-sm" @click="openDetails(track)">🛈 Détails</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="d-block d-md-none p-3">
          <template x-for="track in filteredTracks" :key="track.id">
            <div class="border-bottom py-3">
              <div class="d-flex justify-content-between mb-1">
                <span class="text-muted small fw-bold">Titre</span>
                <span class="fw-bold text-end text-truncate" style="max-width: 200px;" x-text="track.name"></span>
              </div>
              <div class="d-flex justify-content-between mb-1">
                <span class="text-muted small">Artiste</span>
                <span x-text="track.artists[0]?.name"></span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted small">Album</span>
                <span class="text-muted text-end text-truncate" style="max-width: 200px;" x-text="track.album.name"></span>
              </div>
              <div class="text-end">
                <button class="btn btn-primary btn-sm w-100" @click="openDetails(track)">🛈 Détails</button>
              </div>
            </div>
          </template>
        </div>

      </div>
    </section>

    <section class="mb-5">
      <h2 class="h4 fw-bold mb-3 text-dark">Albums Populaires</h2>
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-6 g-3">
        <template x-for="track in tracks.slice(0, 12)" :key="track.album.id + '-' + track.id">
          <div class="col">
            <div class="card h-100 shadow-sm border-0 grid-album-card">
              <img :src="track.album.images[0]?.url" class="card-img-top card-album-img" :alt="track.album.name">
              <div class="card-body p-2 d-flex flex-column justify-content-between">
                <div>
                  <h3 class="h6 card-title text-truncate mb-1" x-text="track.album.name"></h3>
                  <p class="small text-muted mb-1 text-truncate" x-text="track.artists[0]?.name"></p>
                  <p class="small text-muted mb-2 opacity-75" x-text="track.album.release_date"></p>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="badge bg-primary small" x-text="track.album.total_tracks + ' titres'"></span>
                  <span class="badge bg-success small" x-text="'Pop. ' + track.album.popularity"></span>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>


    <!-- fenêtre détails du morceau-->
    <div class="modal fade" 
        :class="{ 'show d-block': isModalOpen, 'd-none': !isModalOpen }" 
        tabindex="-1" 
        style="background: rgba(0,0,0,0.6);" 
        x-show="isModalOpen" 
        x-cloak>
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg bg-white rounded-4">
          
          <div class="modal-header border-bottom-1 py-3">
            <h5 class="modal-title fw-bold text-dark">Détails du morceau</h5>
            <button type="button" class="btn-close" @click="closeDetails()"></button>
          </div>

          <div class="modal-body pt-2">
            <template x-if="selectedTrack">
              <div class="row g-4">
                
                <div class="col-md-5">
                  <img :src="selectedTrack.album.images[2]?.url" class="img-fluid rounded-3 shadow mb-3" alt="Pochette" style="max-width: 100%; height: 300px;">
                  <h4 class="h5 fw-bold mb-1 text-dark" x-text="selectedTrack.album.name"></h4>
                  <p class="text-muted small mb-3" x-text="selectedTrack.album.release_date + ' • ' + selectedTrack.album.total_tracks + ' titre(s)'"></p>
                  <div class="w-100 mb-3">
                    <span class="badge bg-secondary py-2 px-3 text-white fw-normal" x-text="'Popularité : ' + selectedTrack.album.popularity + '/100'"></span>
                  </div>
                </div>

                <div class="col-12 col-md-7">
                  <h3 class="h4 fw-bold text-primary mb-1" x-text="selectedTrack.name"></h3>
                  <p class="text-muted small mb-3" x-text="'Par ' + selectedTrack.artists[0]?.name"></p>

                  <div class="mb-4 p-2 rounded">
                    <p class="small fw-bold text-muted mb-1">Extrait du morceau :</p>
                    <audio controls class="w-100" :src="selectedTrack.preview_url"></audio>
                  </div>

                  <h4 class="h6 fw-bold text-muted border-bottom pb-1 mb-2 text-uppercase" style="font-size: 0.8rem;">Informations sur le morceau</h4>
                  <div class="d-flex justify-content-between align-items-center mb-1 small">
                    <span class="text-secondary">Durée</span>
                    <span class="fw-bold" x-text="formatDuration(selectedTrack.duration_ms)"></span>
                  </div>
                  <div class="d-flex justify-content-between align-items-center mb-1 small">
                    <span class="text-secondary">Popularité</span>
                    <div class="bg-light rounded-pill overflow-hidden border" style="height: 15px; width: 30%;">
                      <div class="bg-success h-100" :style="'width: ' + selectedTrack.popularity + '%'"></div>
                    </div>
                    <span class="fw-bold" x-text="selectedTrack.popularity + '/100'"></span>
                  </div>
                  <div class="d-flex justify-content-between align-items-center mb-1 small">
                    <span class="text-secondary">Numéro de piste</span>
                    <span x-text="selectedTrack.track_number"></span>
                  </div>
                  <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <span class="text-secondary">Contenu explicite</span>
                    <span :class="selectedTrack.explicit ? 'text-danger fw-bold' : 'text-success'" x-text="selectedTrack.explicit ? 'Oui' : 'Non'"></span>
                  </div>

                  <h4 class="h6 fw-bold text-muted border-bottom pb-1 mb-2 text-uppercase" style="font-size: 0.8rem;">Artistes</h4>
                  <div class="d-flex flex-column gap-2 mb-4">
                    <template x-for="artist in selectedTrack.artists" :key="artist.id">
                      <div class="d-flex align-items-center gap-2 p-2 rounded">
                        <img :src="artist.images?.[0]?.url || 'https://via.placeholder.com/40'" class="rounded-circle" style="width: 35px; height: 35px; object-fit: cover;">
                        <div>
                          <p class="mb-0 fw-bold small text-dark" x-text="artist.name"></p>
                          <p class="small text-muted mb-0" style="font-size: 0.7rem;" x-text="'Popularité : ' + artist.popularity + '/100 • Followers : ' + (artist.followers?.total ?? 0).toLocaleString('fr-FR')"></p>
                        </div>
                      </div>
                    </template>
                  </div>

                  <h4 class="h6 fw-bold text-muted border-bottom pb-1 mb-2 text-uppercase" style="font-size: 0.8rem;">Genres</h4>
                  <div class="d-flex flex-wrap gap-1 mb-4">
                    <template x-for="genre in (selectedTrack.album.genres?.length ? selectedTrack.album.genres : (selectedTrack.artists[0]?.genres || ['Variété']))" :key="genre">
                      <span class="badge bg-primary-subtle text-primary fw-normal text-capitalize" x-text="genre"></span>
                    </template>
                  </div>

                  <div class="text-end pt-2">
                    <a :href="selectedTrack.external_urls?.spotify" target="_blank" class="btn btn-success btn-sm fw-bold rounded-pill px-3">
                      Ouvrir dans Deezer
                    </a>
                  </div>

                </div>
              </div>
            </template>
          </div>

          <div class="modal-footer pb-4 pe-4">
            <button type="button" class="btn btn-secondary px-4 rounded-pill" @click="closeDetails()">Fermer</button>
          </div>

        </div>
      </div>
    </div>

  </main>

  <footer class="bg-dark text-white text-center py-3 mt-5 border-top border-success border-3">
    <p class="small mb-0">© 2026 Spoti'stat - Projet d'intégration Web</p>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
