<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoti'stat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>

<body class="bg-light" x-data="spotifyApp">

  <header class="bg-primary text-white text-center py-5 mb-4">
    <h1 class="fw-bold text-uppercase">Ma playlist</h1>
    <p class="fst-italic opacity-75">je sais pas quoi mettre comme sous-titre</p>
  </header>

  <main class="container">
    <section class="card shadow-sm border-0 mb-5">
      <div class="card-header bg-info text-white">
        <span class="fw-bold">Liste des Morceaux</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">Titre</th>
                <th scope="col">Artiste</th>
                <th scope="col">Album</th>
                <th scope="col" class="text-end pe-4">Action</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="track in tracks" :key="track.id">
                <tr>
                  <td class="fw-bold text-truncate" style="max-width: 250px;" x-text="track.name"></td>
                  <td x-text="track.artists[0]?.name"></td>
                  <td class="text-muted text-truncate" style="max-width: 200px;" x-text="track.album.name"></td>
                  <td class="text-end pe-4">
                    <button class="btn btn-primary btn-sm">🛈 Détails</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
